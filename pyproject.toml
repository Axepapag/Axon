[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "axon"
version = "0.1.0"
description = "Axon — exact-character stateful AI runtime and training system"
requires-python = ">=3.12"
dependencies = [
  "numpy>=1.26",
  "torch>=2.3",
  "pydantic>=2.0",
  "fastapi>=0.115",
  "starlette>=1.3",
  "uvicorn[standard]>=0.30",
  "websockets>=13",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2",
  "pytest-asyncio>=0.23",
  "httpx>=0.27",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["curator*", "runtime*", "substrate*", "training*"]
exclude = ["tests*", "runs*", "datasets*", "checkpoints*", "State*", "dist*", "ops*", "roundtable*", "kaggle*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "substrate", "cores", "training", "curator", "runtime", "runtime/bus", "slots", "adapters"]
addopts = "-q"
