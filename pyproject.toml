[project]
name = "axon"
version = "0.1.0"
description = "Axon — token-free slot-era agent"
requires-python = ">=3.12"
dependencies = [
  "numpy>=1.26",
  "torch>=2.3",
  "pydantic>=2.0",
  "starlette>=1.3",
  "uvicorn[standard]>=0.30",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2",
  "pytest-asyncio>=0.23",
  "httpx>=0.27",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "substrate", "cores", "training", "curator", "runtime", "runtime/bus", "slots", "adapters"]
addopts = "-q"